<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827"><title>전산 일일 점검</title>
<link rel="stylesheet" href="stylee.css"><script src="app.js" defer></script>
</head>
<body><div class="app-shell">
<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">IT</div><div><p class="eyebrow">IT OPERATIONS</p><h1>전산 일일 점검</h1></div></div><div class="status-pill"><span class="status-dot"></span> 일일 점검 워크스페이스</div></header>
<main>
<section class="page-intro"><div><p class="eyebrow">DAILY CHECKLIST</p><h2>좋은 아침입니다.</h2><p class="intro-copy">서버 · 백업 · 네트워크 · 보안 · 환경 상태를 확인하고 기록하세요.</p></div><div class="date-badge"><span class="date-badge-label">점검 업무</span><strong>DAILY</strong></div></section>
<section class="panel meta-panel"><div class="section-heading"><div><p class="eyebrow">CHECK DETAILS</p><h3>점검 기본 정보</h3></div><span class="section-caption">점검 정보</span></div>
<div class="form-grid"><div class="field"><label for="check-date">점검일</label><input id="check-date" name="check-date" type="date"></div><div class="field"><label for="inspector-name">점검자</label><input id="inspector-name" name="inspector-name" type="text" placeholder="점검자 이름 입력" autocomplete="name"></div></div></section>
<section class="checklist-section"><div class="section-heading"><div><p class="eyebrow">INSPECTION ITEMS</p><h3>점검 항목</h3></div><span class="section-caption">상태를 선택하고 필요한 메모를 입력하세요.</span></div><div id="checklist-container" class="checklist-container"></div></section>
</main><footer class="footer"><span>IT OPERATIONS / DAILY CHECK</span><span>로컬 화면 · 저장 기능 미포함</span></footer>
</div></body></html>
